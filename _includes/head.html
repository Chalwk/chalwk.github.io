<head>
  <meta charset="UTF-8">

  <!-- Deliberate. Do not touch! -->
  <meta content="width=device-width, initial-scale={{ site.site_scale }}, viewport-fit=cover" name="viewport">

  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#1e88e5">
  <meta name="author" content="Jericho Crosby (Chalwk)">

  <!--
    jekyll-seo-tag emits: <title>, <meta name="description">, canonical,
    og:title/description/url/type/image, og:image:alt, twitter:card/title/description/image,
    and a JSON-LD block.
  -->
  {% seo %}

  <!-- Preconnect / dns-prefetch hints for external resources -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

  <!-- Favicon -->
  {% if site.favicon %}
  <link rel="icon" href="{{ site.favicon | relative_url }}" type="image/x-icon">
  {% endif %}

  <!-- Stylesheets -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/core.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/syntax.css">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Source+Code+Pro:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">

  <!-- PWA manifest -->
  {% if page.pwa %}
  {% assign manifest_url = page.url | append: 'manifest.webmanifest' | relative_url %}
  <link rel="manifest" href="{{ manifest_url }}">
  {% endif %}
</head>
