<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale={{ site.site_scale | default: 1.0 }}, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">

  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- SEO (jekyll-seo-tag handles OG, Twitter, canonical, JSON-LD) -->
  {% seo %}

  <!-- Extra social metadata not emitted by jekyll-seo-tag -->
  <meta property="og:image:alt" content="Jericho Crosby">

  <!-- Theme colour: matches header gradient. Dark variant for dark-mode UAs. -->
  <meta name="theme-color" content="#1e88e5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d47a1" media="(prefers-color-scheme: dark)">

  <!-- Preconnect hints for external resources -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">

  <!-- Favicon -->
  <link rel="icon" href="{{ site.favicon | relative_url }}" type="image/x-icon">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/core.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/syntax.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Source+Code+Pro:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">

  <!-- PWA manifest -->
  {% if page.pwa %}
  {% assign manifest_url = page.url | append: 'manifest.webmanifest' | relative_url %}
  <link rel="manifest" href="{{ manifest_url }}">
  {% endif %}
</head>
