<!DOCTYPE html>

<html lang="{{ site.lang | default: 'en' }}">

{% include head.html %}

<body>

    <a class="skip-link" href="#main-content">Skip to content</a>

    <!-- main site header (header.html emits its own <header class="header">) -->
    {% include header.html %}

    <!-- page content injected here -->
    <main id="main-content">{{ content }}</main>

    <!-- PWA install button container -->
    {% if page.pwa %}
    <div id="pwa-install-container">
        <button aria-label="Install App" class="install-pwa-btn" id="pwa-install-button" type="button">
            <i class="fas fa-download" aria-hidden="true"></i> Install App
        </button>
    </div>
    {% endif %}

    {% include footer.html %}

    <script defer src="{{ site.baseurl }}/assets/js/nav-menu.js"></script>
    {% if page.pwa %}
    <script defer src="{{ site.baseurl }}/assets/js/pwa-install.js"></script>
    {% endif %}

    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-lua.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof Prism !== 'undefined') {
                Prism.hooks.add('after-highlight', function(env) {
                    if (env.language === 'lua' || (env.element && env.element.className.includes('language-lua'))) {
                        var comments = env.element.querySelectorAll('.token.comment');
                        comments.forEach(function(el) {
                            el.innerHTML = el.innerHTML.replace(/(@[a-zA-Z_-]+)/g, '<span class="token ldoc-tag">$1</span>');
                        });
                    }
                });
                Prism.highlightAll();
            }
        });
    </script>

    {% if page.pwa %}
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('{{ page.dir }}sw.js')
                .then(reg => console.log('Service Worker registered', reg))
                .catch(err => console.error('Service Worker registration failed', err));
        }
    </script>
    {% endif %}

</body>

</html>
