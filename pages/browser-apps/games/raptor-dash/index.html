<link rel="stylesheet" href="style.css">

<main>
    <div class="container">
        <section class="panel">
            <div class="panel-head">
                <h1>Raptor Dash</h1>
                <p class="muted small">Jump, dodge, and ride the thermals. Procedurally generated levels - every run is
                    new.</p>
            </div>

            <div id="game-settings">
                <label for="difficulty">Difficulty
                    <select id="difficulty">
                        <option value="easy">Easy</option>
                        <option value="normal" selected>Normal</option>
                        <option value="hard">Hard</option>
                    </select>
                </label>
                <label for="theme">Theme
                    <select id="theme">
                        <option value="day" selected>Day</option>
                        <option value="dusk">Dusk</option>
                        <option value="night">Night</option>
                    </select>
                </label>
            </div>

            <div id="game-container">
                <div class="game-stats">
                    <div class="stat-block score-stat">
                        <strong>Score</strong>
                        <span id="score" class="score">0</span>
                    </div>
                    <div class="status-block">
                        <span id="status">Press Start</span>
                    </div>
                    <div class="stat-block level-stat">
                        <strong>Level</strong>
                        <span id="level" class="score">1</span>
                    </div>
                </div>

                <div class="board-wrap">
                    <canvas id="game-board"></canvas>

                    <div class="game-over-overlay" id="game-over-overlay">
                        <div class="game-over-content">
                            <div id="game-over-message" class="game-over-message"></div>
                            <div id="game-over-score" class="game-over-score"></div>
                            <button class="btn btn-secondary" id="play-again">Play Again</button>
                        </div>
                    </div>
                </div>

                <div class="controls-hint" id="controls-hint"></div>

                <div class="game-buttons">
                    <button class="btn" id="start">
                        <i class="fas fa-play"></i> Start
                    </button>
                    <button class="btn btn-secondary" id="pause" disabled>
                        <i class="fas fa-pause"></i> Pause
                    </button>
                </div>
            </div>
        </section>
    </div>
</main>

<script src="script.js"></script>
