<link rel="stylesheet" href="style.css">

<main>
    <div class="container">
        <section class="panel">
            <div class="panel-head">
                <h1>FatPoly</h1>
                <p class="muted small">Eat healthy shapes, avoid unhealthy ones. Reach level 10 to win!</p>
            </div>

            <div id="game-settings">
                <label for="difficulty">Difficulty
                    <select id="difficulty">
                        <option value="easy">Easy</option>
                        <option value="normal" selected>Normal</option>
                        <option value="hard">Hard</option>
                    </select>
                </label>
                <label for="powerups" id="powerups-label">Power-ups
                    <select id="powerups">
                        <option value="on" selected>On</option>
                        <option value="off">Off</option>
                    </select>
                </label>
            </div>

            <div id="game-container">
                <div class="game-stats">
                    <div class="stat-block score-stat">
                        <strong>Score</strong>
                        <span id="score" class="score">0</span>
                        <span id="best-score" class="best-score">Best: 0</span>
                    </div>
                    <div class="status-block">
                        <span id="status">Level 1</span>
                        <span id="progress" class="progress-text">0 / 8</span>
                        <span id="combo" class="combo-text"></span>
                    </div>
                    <div class="stat-block health-stat">
                        <strong>Health</strong>
                        <div class="health-bar" aria-hidden="true">
                            <div class="health-fill" id="health-fill"></div>
                        </div>
                    </div>
                </div>

                <div class="board-wrap" id="board-wrap">
                    <canvas id="game-board" width="960" height="600"></canvas>

                    <div class="joystick" id="joystick">
                        <div class="joystick-knob" id="joystick-knob"></div>
                    </div>

                    <div class="game-over-overlay" id="pause-overlay">
                        <div class="game-over-content">
                            <div class="game-over-message">Paused</div>
                            <button class="btn btn-secondary" id="resume-btn">Resume</button>
                        </div>
                    </div>

                    <div class="game-over-overlay" id="game-over-overlay">
                        <div class="game-over-content">
                            <div id="game-over-message" class="game-over-message"></div>
                            <div id="game-over-score" class="game-over-score"></div>
                            <div id="game-over-best" class="game-over-best"></div>
                            <button class="btn btn-secondary" id="play-again">Play Again</button>
                        </div>
                    </div>
                </div>

                <div class="controls-hint" id="controls-hint"></div>

                <div class="powerup-legend">
                    <span class="pu-chip"><i class="pu-dot" style="background:#4ade80"></i>Healthy</span>
                    <span class="pu-chip"><i class="pu-dot" style="background:#ef4444"></i>Unhealthy</span>
                    <span class="pu-chip"><i class="pu-dot" style="background:#a78bfa"></i>Power-up</span>
                </div>

                <div class="action-row">
                    <button class="btn btn-secondary" id="reset">
                        <i class="fas fa-redo"></i> New Game
                    </button>
                    <button class="btn btn-icon" id="pause-btn" aria-label="Pause game" title="Pause (P)">
                        <i class="fas fa-pause"></i>
                    </button>
                    <button class="btn btn-icon" id="mute-btn" aria-label="Mute sound" title="Mute (M)">
                        <i class="fas fa-volume-up"></i>
                    </button>
                </div>
            </div>
        </section>
    </div>
</main>

<script src="script.js"></script>
