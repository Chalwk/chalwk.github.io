<link rel="stylesheet" href="style.css">

<main>
    <div class="container">
        <section class="panel">
            <div class="panel-head">
                <h1>Enhanced Minesweeper</h1>
                <p class="muted small">Enhanced Minesweeper with multiple difficulty levels and custom options.</p>
            </div>

            <div id="game-settings">
                <label for="difficulty">Difficulty
                    <select id="difficulty">
                        <option value="beginner">Beginner (9&times;9, 10)</option>
                        <option value="intermediate">Intermediate (16&times;16, 40)</option>
                        <option value="expert">Expert (16&times;30, 99)</option>
                        <option value="custom">Custom</option>
                    </select>
                </label>

                <div class="custom-panel hidden" id="customPanel">
                    <input id="rows" max="50" min="5" placeholder="Rows" type="number" aria-label="Rows">
                    <input id="cols" max="80" min="5" placeholder="Cols" type="number" aria-label="Columns">
                    <input id="mines" min="1" placeholder="Mines" type="number" aria-label="Mines">
                    <button class="btn btn-secondary" id="applyCustom">Apply</button>
                </div>
            </div>

            <div id="game-container">
                <div class="game-stats">
                    <div class="stat-block mines-stat">
                        <strong>Mines</strong>
                        <span id="mineCount" class="score">10</span>
                    </div>
                    <div class="status-block">
                        <span id="status">Click any cell to begin</span>
                    </div>
                    <div class="stat-block time-stat">
                        <strong>Time</strong>
                        <span id="timer" class="score">00:00</span>
                    </div>
                </div>

                <div class="board-wrap">
                    <div class="board-scroll">
                        <div aria-label="Minesweeper board" class="minesweeper-board" id="board" tabindex="0"></div>
                    </div>

                    <div class="game-over-overlay" id="game-over-overlay">
                        <div class="game-over-content">
                            <div id="game-over-message" class="game-over-message"></div>
                            <div id="game-over-score" class="game-over-score"></div>
                            <button class="btn btn-secondary" id="play-again">Play Again</button>
                        </div>
                    </div>
                </div>

                <div class="action-row">
                    <button class="btn btn-secondary" id="newBtn">
                        <i class="fas fa-plus-circle"></i> New Game
                    </button>
                    <button class="btn btn-secondary" id="flagToggle">
                        <i class="fas fa-flag"></i> Toggle Flagging
                    </button>
                    <button class="btn btn-secondary" id="hintBtn">
                        <i class="fas fa-lightbulb"></i> Hint
                    </button>
                    <button class="btn btn-secondary" id="revealAllBtn">
                        <i class="fas fa-eye"></i> Reveal Solution
                    </button>
                    <button class="btn btn-secondary" id="bestTimesBtn">
                        <i class="fas fa-trophy"></i> Best Times
                    </button>
                </div>
            </div>
        </section>
    </div>
</main>

<div class="modal hidden" id="bestTimesModal">
    <div class="modal-inner">
        <h3 class="modal-title">Best Times</h3>
        <ul class="best-times-list" id="bestTimesList"></ul>
        <button class="btn btn-secondary" id="closeBestTimes">Close</button>
    </div>
</div>

<script src="script.js"></script>
