<link rel="stylesheet" href="style.css">

<main>
    <div class="container">
        <section class="panel">
            <div class="panel-head">
                <h1>Ricochet Rift</h1>
                <p class="muted small">Deflect the orb, grab rift power-ups, and outlast your rival.</p>
            </div>

            <div id="game-settings">
                <label for="difficulty" id="difficulty-label">AI Skill
                    <select id="difficulty">
                        <option value="rookie">Rookie</option>
                        <option value="veteran" selected>Veteran</option>
                        <option value="master">Master</option>
                    </select>
                </label>
                <label for="target-score">First To
                    <select id="target-score">
                        <option value="5">5 points</option>
                        <option value="7" selected>7 points</option>
                        <option value="11">11 points</option>
                    </select>
                </label>
                <label for="powerups">Rift Orbs
                    <select id="powerups">
                        <option value="on" selected>On</option>
                        <option value="off">Off</option>
                    </select>
                </label>
            </div>

            <div id="game-container">
                <div class="game-stats">
                    <div class="stat-block player1">
                        <strong>Player 1</strong>
                        <span id="score-1" class="score score-player-1">0</span>
                        <span id="badge-1" class="badge"></span>
                    </div>
                    <div class="status-block">
                        <span id="status">First to 7</span>
                        <span id="rally" class="rally">Rally 0</span>
                    </div>
                    <div class="stat-block player2">
                        <strong id="player-2-label">AI</strong>
                        <span id="score-2" class="score score-player-2">0</span>
                        <span id="badge-2" class="badge"></span>
                    </div>
                </div>

                <div class="board-wrap">
                    <canvas id="game-board" width="960" height="600"></canvas>

                    <div class="game-over-overlay" id="game-over-overlay">
                        <div class="game-over-content">
                            <div id="game-over-message" class="game-over-message"></div>
                            <div id="game-over-score" class="game-over-score"></div>
                            <button class="btn btn-secondary" id="play-again">Play Again</button>
                        </div>
                    </div>
                </div>

                <div class="controls-hint" id="controls-hint"></div>

                <div class="powerup-legend">
                    <span class="pu-chip"><i class="pu-dot" style="background:#4ade80"></i>Wide</span>
                    <span class="pu-chip"><i class="pu-dot" style="background:#fbbf24"></i>Multi</span>
                    <span class="pu-chip"><i class="pu-dot" style="background:#a78bfa"></i>Shield</span>
                    <span class="pu-chip"><i class="pu-dot" style="background:#60a5fa"></i>Slow</span>
                    <span class="pu-chip"><i class="pu-dot" style="background:#f97316"></i>Spike</span>
                </div>

                <button class="btn btn-secondary" id="reset">
                    <i class="fas fa-redo"></i> New Game
                </button>
            </div>
        </section>
    </div>
</main>

<script src="script.js"></script>
