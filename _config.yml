# ------------------------------------------------------------------------------
# Site identity / basic info
# ------------------------------------------------------------------------------
title: Jericho Crosby (Chalwk)
tagline: "Autistic Programmer · Gamer · Advocate"
description: "Autistic programmer, gamer, and advocate - building tools, mods, and games."

url: https://chalwk.github.io   # production domain (GitHub Pages)
baseurl: ""                     # not hosting in a subfolder
lang: en-NZ
locale: en_NZ
timezone: Pacific/Auckland

# Deliberate. Do not touch!
# Used to shrink the responsive viewport scale on mobile (see head.html).
site_scale: 0.65

# ------------------------------------------------------------------------------
# Build behavior (performance + markdown rendering)
# ------------------------------------------------------------------------------
incremental: true # speeds up rebuilds during dev

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - LICENSE
  - run.bat

markdown: kramdown # markdown processor
kramdown:
  syntax_highlighter: nil
  input: GFM
  hard_wrap: false
  toc_levels: 2..6

sass:
  style: compressed # minify CSS output
  quiet_deps: true

# ------------------------------------------------------------------------------
# SEO / social metadata (used by jekyll-seo-tag)
# ------------------------------------------------------------------------------
title_separator: "|"
twitter:
  card: summary_large_image

author:
  name: Jericho Crosby
  url: https://github.com/Chalwk

favicon: favicon.ico              # browser tab icon

# ------------------------------------------------------------------------------
# External links used across layouts/components
# ------------------------------------------------------------------------------
links:
  Community_Discord: https://discord.gg/VAEb4FXU5 # Chalwk - Code & Chill
  CPAS_Discord: https://discord.gg/NsndXgYfxQ
  SPCLib_Discord: https://discord.gg/D76H7RVPC9
  Liberty_Discord: https://discord.gg/aQXhJy8UTT
  Twitch: https://www.twitch.tv/chalwk
  Email: chalwk.dev@gmail.com

# ------------------------------------------------------------------------------
# Jekyll plugins
# ------------------------------------------------------------------------------
plugins:
  - jekyll-toc                # auto table of contents generation
  - jekyll-seo-tag            # SEO tags + OpenGraph metadata
  - jekyll-sitemap            # auto sitemap.xml generation
  - jekyll-last-modified-at   # shows last updated timestamps
  - jekyll-relative-links     # helps resolve internal links safely

# ------------------------------------------------------------------------------
# Relative link handling
# ------------------------------------------------------------------------------
relative_links:
  enabled: true
  collections: true

# ------------------------------------------------------------------------------
# Default front matter (for the sake of DRY)
# ------------------------------------------------------------------------------
defaults:

  # Global defaults (apply to all pages, posts, and collections)
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/avatar.png
        alt: "Jericho Crosby"

  # Blog posts
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: "Jericho Crosby"
      permalink: /blog/:year/:month/:day/:title/
      toc: true

  # Static pages
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      toc: true

# ------------------------------------------------------------------------------
# PWA (Progressive Web App) settings
# ------------------------------------------------------------------------------
default_icons:
  - src: "icons/icon-192x192.png"
    sizes: "192x192"
    type: "image/png"
    purpose: "any maskable"

  - src: "icons/icon-512x512.png"
    sizes: "512x512"
    type: "image/png"
    purpose: "any maskable"

default_categories:
  - accessibility
  - games

# Files cached for offline support (service worker / PWA behavior)
default_urls:
  - "./"
  - "./index.html"
  - "./style.css"
  - "./script.js"
  - "./manifest.json"
  - "./icons/icon-192x192.png"
  - "./icons/icon-512x512.png"